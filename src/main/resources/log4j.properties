# ============================================================================
# Configuracion de log4j del proyecto central.
#
# ESTE ARCHIVO TIENE QUE VIVIR EN src/main/resources, NO en src/main/webapp/WEB-INF.
#
# Estuvo anos en WEB-INF/log4j.properties, y ahi log4j NUNCA lo encontro: en un
# WAR la raiz del classpath es WEB-INF/classes, y el archivo estaba un nivel
# arriba. El sintoma era el aviso "No appenders could be found for logger
# (log_file)" en cada arranque, que nadie leyo, y la consecuencia es que las
# 393 llamadas a logger.info() con el SQL completo NO ESCRIBIAN EN NINGUNA
# PARTE. Verificado el 2026-09-08 sobre el WAR construido.
#
# OJO con lo que esto implica: los 8,6 GB de catalina.out NO los llenaba log4j.
# Los llenan los 721 System.out.println sueltos del codigo, y esos no los
# controla ninguna configuracion, porque en Tomcat System.out ES catalina.out.
# Para acotar ese archivo el control es logrotate, no este properties. Bajarlo
# de verdad exige tocar codigo Java.
#
# EL NIVEL ESTA EN WARN A PROPOSITO. Al mover el archivo al classpath, log4j
# queda configurado por primera vez, asi que en DEBUG o INFO arrancaria de
# golpe un chorro de SQL que este servidor nunca ha escrito. Con WARN entran
# advertencias y errores, que es lo que sirve para diagnosticar, y el SQL
# sigue callado. Si alguna vez se necesita el SQL para perseguir algo, se pasa
# a DEBUG un rato y se devuelve; no se deja asi.
#
# El appender de archivo apuntaba a C:\log\prueba.log, una ruta de Windows en
# un servidor Ubuntu. Ahora usa ${catalina.base}, que log4j resuelve contra las
# propiedades del sistema, para que el mismo archivo sirva en el servidor y en
# el Eclipse local sin que nadie lo edite antes de desplegar.
#
# Y es RollingFileAppender, no DailyRollingFileAppender: el segundo IGNORA
# MaxFileSize y MaxBackupIndex, que estaban puestos y no hacian nada.
# ============================================================================

log4j.rootCategory=WARN,A4,stdout

# ----------------------------------------------------------------------------
# stdout: termina en catalina.out. Solo errores.
# ----------------------------------------------------------------------------
log4j.appender.stdout=org.apache.log4j.ConsoleAppender
log4j.appender.stdout.Threshold=ERROR
log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
log4j.appender.stdout.layout.ConversionPattern=[%d] [%C{1}.%M(%L)] - %-5p - %m%n

# ----------------------------------------------------------------------------
# A4: el log de la aplicacion, con techo real de 550 MB entre los 11 archivos.
# ----------------------------------------------------------------------------
log4j.appender.A4=org.apache.log4j.RollingFileAppender
log4j.appender.A4.file=${catalina.base}/logs/aplicacion.log
log4j.appender.A4.MaxFileSize=50MB
log4j.appender.A4.MaxBackupIndex=10
log4j.appender.A4.append=true
log4j.appender.A4.layout=org.apache.log4j.PatternLayout
log4j.appender.A4.layout.ConversionPattern=[%d] [%c.%M(%L)] - %-5p - %m%n
