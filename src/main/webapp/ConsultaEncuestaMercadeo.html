<!DOCTYPE html>
<html lang="es">
	<head>
		<title>CONSULTA ENCUESTAS DE MERCADEO</title>
		<meta charset="utf-8" />
		<meta http-equiv="Expires" content="0">
		<meta http-equiv="Last-Modified" content="0">
		<meta http-equiv="Cache-Control" content="no-cache, mustrevalidate">
		<meta http-equiv="Pragma" content="no-cache">
		<link href="css/bootstrap.min.css" rel="stylesheet" type="text/css" />
		<link href="css/all.min.css" rel="stylesheet" type="text/css" />
		<link href="css/jquery-ui.min.css" rel="stylesheet" type="text/css" />
		<link rel="stylesheet" type="text/css" href="css/jquery.dataTables.min.css">
		<link rel="stylesheet" href="css/jquery-confirm.min.css">
		<script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.4/jquery.min.js"></script>
		<script type="text/javascript" src="js/bootstrap.min.js"></script>
		<script type="text/javascript" charset="utf8" src="js/jquery.dataTables.js"></script>
		<style>
			.panel-filtros { margin-top: 15px; }
			.tarjeta-total {
				background: #fff; border: 1px solid #ddd; border-radius: 6px;
				padding: 14px 18px; text-align: center; margin-bottom: 12px;
			}
			.tarjeta-total .numero { font-size: 30px; font-weight: 700; color: #20287f; line-height: 1.1; }
			.tarjeta-total .rotulo { font-size: 12px; color: #777; text-transform: uppercase; letter-spacing: .5px; }
			.bloque-pregunta { margin-bottom: 22px; }
			.bloque-pregunta h4 { margin-bottom: 4px; color: #20287f; }
			.bloque-pregunta .subtitulo { color: #888; font-size: 12px; margin-bottom: 10px; }
			.barra-fondo { background: #eee; border-radius: 3px; height: 20px; width: 100%; position: relative; }
			.barra-valor { background: #20287f; height: 20px; border-radius: 3px; }
			.col-etiqueta { width: 40%; }
			.col-barra { width: 40%; }
			.col-cifra { width: 20%; text-align: right; white-space: nowrap; }
			.sin-datos { color: #999; font-style: italic; padding: 20px 0; }
		</style>
	</head>
	<body>

		<div id="cargarMenu"></div>
		<label id="usuariologin" style="color:black;"></label></p>
		<script type="text/javascript">

			//Obtenemos el valor de la variable server, con base en la URL digitada
			var loc = window.location;
			var pathName = loc.pathname.substring(0, loc.pathname.lastIndexOf('/') + 1);
			server = loc.href.substring(0, loc.href.length - ((loc.pathname + loc.search + loc.hash).length - pathName.length));
			var respuesta ='';
			var usuario = "";
			var nombreusuario = "";
			$.ajax({
				url: server + 'ValidarUsuarioAplicacion',
				dataType: 'json',
				type: 'post',
				async: false,
				success: function(data){
					respuesta =  data[0].respuesta;
					usuario = data[0].nombreusuario;
					nombreusuario = data[0].usu;
				}
			});
			switch(respuesta)
			{
				case 'OK':
					$('#cargarMenu').load("Menu.html");
					break;
				case 'OKA':
					$('#cargarMenu').load("MenuAdm.html");
					break;
				case 'OKP':
					$('#cargarMenu').load("MenuPQRS.html");
					break;
				default:
					location.href = server +"Index.html";
					break;
			}

			$('#usuariologin').html(usuario);
		</script>

		<div class="container">
			<h1>ENCUESTAS DE MERCADEO</h1>

			<div class="panel panel-default panel-filtros">
				<div class="panel-heading">Filtros</div>
				<div class="panel-body">
					<div class="row">
						<div class="col-md-3">
							<label for="selectTiendas">Tienda</label>
							<select id="selectTiendas" class="form-control"></select>
						</div>
						<div class="col-md-4">
							<label for="selectPreguntas">Pregunta</label>
							<select id="selectPreguntas" class="form-control"></select>
						</div>
						<div class="col-md-2">
							<label for="fechainicial">Fecha inicial</label>
							<input type="text" id="fechainicial" name="fechainicial" class="form-control" placeholder="aaaa-mm-dd">
						</div>
						<div class="col-md-2">
							<label for="fechafinal">Fecha final</label>
							<input type="text" id="fechafinal" name="fechafinal" class="form-control" placeholder="aaaa-mm-dd">
						</div>
						<div class="col-md-1">
							<label>&nbsp;</label>
							<input type="button" id="btnconsultar" class="btn btn-primary btn-block" value="Consultar" onclick="consultarEncuestas()">
						</div>
					</div>
				</div>
			</div>

			<div class="row" id="panelTotales" style="display:none;">
				<div class="col-md-3">
					<div class="tarjeta-total">
						<div class="numero" id="totalEncuestas">0</div>
						<div class="rotulo">Encuestas</div>
					</div>
				</div>
				<div class="col-md-3">
					<div class="tarjeta-total">
						<div class="numero" id="totalRespuestas">0</div>
						<div class="rotulo">Respuestas</div>
					</div>
				</div>
			</div>

			<ul class="nav nav-tabs" role="tablist">
				<li role="presentation" class="active"><a href="#tabResumen" role="tab" data-toggle="tab">Resumen</a></li>
				<li role="presentation"><a href="#tabDetalle" role="tab" data-toggle="tab">Detalle</a></li>
			</ul>

			<div class="tab-content" style="padding-top:18px;">
				<div role="tabpanel" class="tab-pane active" id="tabResumen">
					<div id="contenedorResumen">
						<p class="sin-datos">Seleccione los filtros y presione Consultar.</p>
					</div>
				</div>
				<div role="tabpanel" class="tab-pane" id="tabDetalle">
					<p>
						<input type="button" id="btnexportar" class="btn btn-default btn-sm" value="Exportar a CSV" onclick="exportarDetalle()">
					</p>
					<table id="grid-detalle" class="table table-striped table-bordered" style="width:100%">
						<thead>
							<tr>
								<th>Fecha</th>
								<th>Tienda</th>
								<th>Pedido</th>
								<th>Cliente</th>
								<th>Pregunta</th>
								<th>Respuesta</th>
							</tr>
						</thead>
						<tbody></tbody>
					</table>
				</div>
			</div>

		</div>
	</body>
	<script src="js/consultaencuestamercadeo.js" type="text/javascript"></script>
	<script src="js/jquery-confirm.min.js"></script>
	<script src="js/jquery-ui.min.js"></script>
	<script type="text/javascript" src="js/datepicker.js"></script>
	<script>
		$("#fechainicial").datepicker($.datepicker.regional["es"]);
		$("#fechafinal").datepicker($.datepicker.regional["es"]);
		$("#fechainicial").datepicker("option", "dateFormat", "yy-mm-dd");
		$("#fechafinal").datepicker("option", "dateFormat", "yy-mm-dd");
	</script>
</html>
