<!DOCTYPE html>
<html lang="es">
<head>
<title>MODIFICAR PQRS</title>
<meta charset="utf-8" />
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
<link rel="stylesheet"
	href="https://use.fontawesome.com/releases/v5.15.4/css/all.css"
	crossorigin="anonymous">
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap-fileinput@5.5.3/css/fileinput.min.css"
	rel="stylesheet">
<script
	src="https://cdn.jsdelivr.net/npm/bootstrap-fileinput@5.5.3/js/fileinput.min.js"></script>
<script>
	$.fn.fileinput.defaults.theme = 'gly';
</script>
<link rel="stylesheet" href="js/mostrarImagen.css"
	crossorigin="anonymous">
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/es.js"></script>
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
	integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N"
	crossorigin="anonymous">
<script
	src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"
	integrity="sha384-Fy6S3B9q64WdZWQUiU+q4/2Lc9npb8tCaSX9FK7E8HnRr0Jz8D6OP9dO5Vg3Q9ct"
	crossorigin="anonymous"></script>
<link rel="stylesheet"
	href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap4.min.css">
<script
	src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script
	src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap4.min.js"></script>
<link rel="stylesheet" href="css/pqrs.css" crossorigin="anonymous">
<link rel="icon" href="img/logo.ico" type="image/x-icon">
</head>
<body>

	<div id="cargarMenu"></div>
	<div class="container-central">
		<div class="row">
			<div class="col-md-6">
				<div class="container-modPqrs">
					<form>
						<h1>INFORMACIÓN FILTRO CONSULTA PQRS</h1>
						<div class="row">
							<div class="col-md-12">
								<div class="row">

									<div class="col-sm-12 form-group">
										<div class="button-conf text-right">
											<button type="button" class="btn btn-info"
												onclick="generarReporte()">Generar Reporte</button>
										</div>
									</div>
									<div class="col-sm-6 form-group">
										<label>Fecha Inicial</label><input type="text"
											id="fechainicial" name="fechainicial" class="form-control"
											placeholder="Fecha Inicial" autocomplete="off">
									</div>
									<div class="col-sm-6 form-group">
										<label>Fecha Final</label><input type="text" id="fechafinal"
											name="fechafinal" class="form-control"
											placeholder="Fecha Final" autocomplete="off">
									</div>
									<div class="col-sm-6 form-group">
										<label>Tienda</label> <select id="selectTiendas"
											class="form-control"></select>
									</div>
									<div class="col-sm-6 form-group">
										<label>Tipo de Solicitud</label> <select id="selectSolicitud"
											class="form-control" required>
											<option value="" selected>Seleccione una opción</option>
											<option value='peticion'>Peticion</option>
											<option value='queja'>Queja</option>
											<option value='reclamo'>Reclamo</option>
											<option value='sugerencia'>Sugerencia</option>
											<option value='felicitacion'>Felicitación</option>
										</select>
									</div>

									<div class="col-sm-6 form-group d-flex align-items-center">
										<label class="custom-switch mb-0"> <input
											type="checkbox" id="filtrodescuentoRed"
											name="filtrodescuentoRed"> <span
											class="custom-slider"></span>
										</label> <label for="filtrodescuentoRed" class="mb-0 ml-2">Descuento
											redimido</label>
									</div>

									<div class="col-sm-12 form-group d-flex align-items-center">
										<div class="estado-container">
											<div class="estado">
												<div class="cuadro pendiente"></div>
												<span>Pendiente</span>
											</div>
											<div class="estado">
												<div class="cuadro enproceso"></div>
												<span>En Proceso</span>
											</div>
											<div class="estado">
												<div class="cuadro escalado"></div>
												<span>Escalado</span>
											</div>
											<div class="estado">
												<div class="cuadro cerrado"></div>
												<span>Cerrado</span>
											</div>
										</div>
									</div>


								</div>
								<div class="button-conf text-right">
									<button type="button" class="btn btn-success"
										onclick="consultarPQRS()">Consultar PQRS</button>
								</div>
								<div class="table-responsive-sm">
									<table id="grid-consultaPQRS"
										class="table table-condensed table-hover " cellspacing="0"
										width="100%">
										<thead>
											<tr>
												<th>#</th>
												<th>Prioridad</th>
												<th>Fecha</th>
												<th>Tipo</th>
												<th>Nombres</th>
												<th>Direccion</th>
												<th>Teléfono</th>
												<th>Tienda</th>
												<th>Origen</th>
												<th>Foco</th>
												<th>Estado</th>
												<th>Archivo</th>
											</tr>
										</thead>
										<tbody></tbody>
									</table>
								</div>
							</div>
						</div>
					</form>
				</div>
			</div>
			<div class="col-md-6">
				<div class="container-modPqrs">

					<form id="cliente">
						<h1>MODIFICACIÓN PQRS</h1>
						<div class="row">

							<div class="col-md-12">
								<div class="row">
									<div class="col-sm-6 form-group">
										<label>Número de PQRS</label><input type="text"
											id="idSolicitudPQRS" name="idSolicitudPQRS" placeholder="#"
											class="form-control" disabled>
									</div>
									<div class="col-sm-6 form-group">
										<label>Fecha Solicitud</label><input type="text" id="fecha"
											name="fecha" class="form-control" placeholder="Fecha"
											autocomplete="off">
									</div>
									<div class="col-sm-6 form-group">
										<label>Tipo de Solicitud</label> <select
											id="selectSolicitudpqrs" class="form-control"
											placeholder="Tipo Solicitud" required>
											<option value="" disabled selected hidden>Seleccione
												una opción</option>
											<option value='peticion'>Peticion</option>
											<option value='queja'>Queja</option>
											<option value='reclamo'>Reclamo</option>
											<option value='sugerencia'>Sugerencia</option>
											<option value='felicitacion'>Felicitación</option>
										</select>
									</div>
									<div class="col-sm-6 form-group">
										<label>Motivo</label> <select id="selectMotivo"
											class="form-control" required>
											<option value="" disabled selected hidden>Seleccione
												un motivo</option>
										</select>
									</div>

									<div class="col-sm-6 form-group">
										<label>Prioridad</label> <select id="selectPrioridad"
											class="form-control" required>
											<option value="" disabled selected hidden>Seleccione
												una prioridad</option>
										</select>
									</div>
									<div class="col-sm-6 form-group">
										<label>Teléfono Cliente</label><input type="text"
											id="telefono" name="telefono" class="form-control"
											placeholder="Telefono" maxlength="10">
									</div>
									<div class="col-sm-6 form-group">
										<label>Nombres</label><input type="text" id="nombres"
											name="nombres" class="form-control" placeholder="Nombres"
											maxlength="20">
									</div>
									<div class="col-sm-6 form-group">
										<label>Correo Electrónico</label><input type="email"
											id="correo" name="correo" class="form-control"
											placeholder="Ej. persona@correo.com">
										<div id="errorCorreo" style="color: red; display: none;">Correo
											inválido</div>
									</div>
									<div class="col-sm-6 form-group">
										<label>Apellidos</label><input type="text" id="apellidos"
											name="apellidos" class="form-control" placeholder="Apellidos"
											maxlength="20">
									</div>
									<div class="col-sm-6 form-group">
										<label>Dirección</label><input type="text" id="direccion"
											name="direccion" class="form-control" placeholder="Direccion"
											maxlength="30">
									</div>
									<div class="col-sm-6 form-group">
										<label>Municipio</label><select id="selectMunicipio"
											class="form-control"></select>
									</div>
									<div class="col-sm-6 form-group">
										<label>Complemento Dirección</label><input type="text"
											id="zona" name="zona" class="form-control" placeholder="Zona"
											maxlength="30">
									</div>
									<div class="col-sm-6 form-group">
										<label>Tienda PQRS</label><select id="selectTiendaspqrs"
											class="form-control" required></select>
									</div>
									<div class="col-sm-6 form-group">
										<label>Origen PQRS</label><select id="selectOrigen"
											class="form-control" required></select>
									</div>
									<div class="col-sm-6 form-group">
										<label>Foco PQRS</label><select id="selectFoco"
											class="form-control" required></select>
									</div>
									<div class="col-sm-6 form-group">
										<label>Queja Externa/Interna</label> <select id="selectTipo"
											class="form-control" required>
											<option value="" disabled selected hidden>Seleccione
												una opción</option>
											<option value="externa">externa</option>
											<option value="interna">interna</option>
										</select>
									</div>
									<div class="col-sm-6 form-group">
										<label>Área Responsable</label> <select
											id="selectAreaResponsable" class="form-control" required>
											<option value="" disabled selected hidden>Seleccione
												una opción</option>
											<option value="tienda">tienda</option>
											<option value="contact">contact</option>
											<option value="tecnologia">tecnologia</option>
											<option value="calidad">calidad</option>
										</select>
									</div>
									<div class="col-sm-6 form-group">
										<label>Registrado por</label><select
											id="selectUsuarioRegistro" required class="form-control"></select>
									</div>
									<div class="col-sm-6 form-group">
										<label>Redimido por</label><select id="selectUsuarioRedencion"
											class="form-control" required></select>
									</div>
									<div class="col-sm-6 form-group">
										<label>Estado</label><select id="selectEstado"
											class="form-control"></select>
									</div>

									<div class="col-sm-6 form-group">
										<label>Factura Tienda</label><input type="text"
											id="idpedidotienda" name="idpedidotienda"
											class="form-control" onchange="validarNumero(this);">
									</div>
									<div class="col-sm-6 form-group">
										<label>Valor Pedido</label> <input type="text"
											id="valorPedido" name="valorPedido" class="form-control"
											onchange="validarNumero(this);">
									</div>

									<div class="col-sm-6 form-group">
										<label>Porcentaje Descuento</label> <select
											id="selectPorcentajeDesc" class="form-control"
											onchange="calcularDescuento();">
											<option value="0" selected>Ninguno</option>
											<option value="10">10%</option>
											<option value="20">20%</option>
											<option value="50">50%</option>
											<option value="100">100%</option>
										</select>
									</div>
									<div class="col-sm-6 form-group">
										<label>Valor del Descuento</label> <input type="text"
											id="valorDescuento" name="valorDescuento"
											class="form-control" onchange="validarNumero(this);">
									</div>
									<div class="col-sm-6 form-group">
										<label>Factura redención</label><input type="text"
											id="idpedidoredencion" name="idpedidoredencion"
											class="form-control" onchange="validarNumero(this);">
									</div>


									<div class="col-sm-6 form-group d-flex align-items-center">
										<label class="custom-switch mb-0"> <input
											type="checkbox" id="descuentoRedimido"
											name="descuentoRedimido"> <!-- Aquí está el cambio -->
											<span class="custom-slider"></span>
										</label> <label for="descuentoRedimido" class="mb-0 ml-2">
											Descuento redimido </label>
									</div>
									<div class="col-sm-6 form-group">
										<label> <input type="checkbox" id="ccVinculado"
											name="ccVinculado" style="margin-right: 6px;">
											Vinculado al Contact Center
										</label>
									</div>
									<div class="col-sm-6 form-group text-right">
										<button type="button" class="btn btn-primary"
											onclick="abrirModalRespuesta()">Correo de Respuesta</button>
								<button id="btnEnviarEncuestaS" type="button" class="btn btn-warning">Encuesta de satisfacción</button>

									</div>


									<div class="col-sm-12 form-group">
										<div class="card mt-4">
											<div class="card-header">
												<h5 class="mb-0">Comentarios</h5>
											</div>
											<div class="card-body">
												<!-- Historial de comentarios -->
												<div id="historialComentarios" class="mb-4">
													<!-- Comentarios cargados dinámicamente por JS -->
												</div>

												<!-- Nuevo comentario -->
												<div class="form-group">
													<textarea id="nuevoComentario" class="form-control"
														rows="3"></textarea>
													<button id="btnAgregarComentario" type="button"
														class="btn btn-primary mt-2">Añadir comentario</button>
												</div>
											</div>
										</div>

									</div>
									<div class="col-sm-12 text-left">
										<button type="button" class="btn btn-danger"
											onclick="DescartarPQRS()">Descartar PQRS</button>
										<button type="button" class="btn btn-primary"
											onclick="EditarPQRS()">Actualizar PQRS</button>
									</div>
									<div class="col-sm-12">
										<div class="ful-img" id="fulImgBox">
											<img src="" id="fulImg" alt=""> <span
												onclick="closeImg()">X</span>
										</div>
										<div class="img-gallery" id="img-gallery"></div>
									</div>

									<div class="col-sm-12">
										<div class="form-group">
											<!-- campo en el que el usuario puede cargar uno o más archivos-->
											<div class="file-loading">
												<input id="file-1" type="file" multiple class="file"
													data-overwrite-initial="false" data-min-file-count="2"
													data-theme="fa5">
											</div>
										</div>
									</div>
								</div>
							</div>
						</div>
						<input type="button" class="btn btn-success btn-lg"
							value="Guardar Archivos" onclick="AdicionarImagenesPQRS()">
					</form>
				</div>
			</div>
		</div>

		<div class="modal fade" id="modalEnvioRespuesta">
			<div class="modal-dialog" role="document">
				<div class="modal-content">
					<div class="modal-header">
						<h5 class="modal-title">Envio Respuesta Pqrs</h5>
						<button type="button" class="close" data-dismiss="modal"
							aria-label="Close">
							<span aria-hidden="true">&times;</span>
						</button>
					</div>
					<div class="modal-body">
						<form>
							<div class="row">
								<div class="col-md-3">
									<div class="form-group">
										<label class="text-black font-w500">ID</label> <input
											id="idpqrs_envio" type="text" class="form-control" disabled>
									</div>
								</div>
								<div class="col-md-9">
									<div class="form-group">
										<label class="text-black font-w500">Cliente</label> <input
										id="cliente_envio"	type="text" class="form-control">
									</div>
								</div>


							</div>

							<div class="form-group">
								<label class="text-black font-w500">Correo Electrónico</label> <input
									id="correo_envio" type="text" class="form-control">
									<div id="errorCorreoEnv" style="color: red; display: none;">Correo
											inválido</div>
							</div>

							<div class="form-group">
								<label class="text-black font-w500">Contenido del correo</label>
								<textarea class="form-control" id="contenidoCorreo" rows="6" style="white-space: pre-wrap; word-wrap: break-word;"
									placeholder="Escribe aquí el mensaje que deseas enviar al cliente..."
									required></textarea>
							</div>
							<div class="form-group">
								<button id="btnEnviarCorreo" type="button" class="btn btn-primary">Enviar</button>
							</div>
						</form>
					</div>
				</div>
			</div>

		</div>

	</div>

</body>
<script
	src="https://cdn.jsdelivr.net/npm/exceljs@4.3.0/dist/exceljs.min.js"></script>
<script
	src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="js/modificarpqrs.js" type="text/javascript"></script>

</html>
