<!DOCTYPE html>
<html lang="es">
<head>

<title>Peticiones Quejas Reclamos Sugerencias</title>
<meta charset="utf-8" />
<link rel="stylesheet"
	href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap4.min.css">

<!-- jQuery (necesario para DataTables) -->
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>

<!-- DataTables JS -->
<script
	src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script
	src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap4.min.js"></script>
<link rel="stylesheet"
	href="https://use.fontawesome.com/releases/v5.15.4/css/all.css"
	crossorigin="anonymous">
<!-- el archivo CSS de estilo del complemento fileinput -->
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
<!-- Fileinput v5.5.3+ -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap-fileinput@5.5.3/css/fileinput.min.css"
	rel="stylesheet">
<script
	src="https://cdn.jsdelivr.net/npm/bootstrap-fileinput@5.5.3/js/fileinput.min.js"></script>
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/es.js"></script>
<script>
	$.fn.fileinput.defaults.theme = 'gly';
</script>
<link rel="stylesheet" href="js/mostrarImagen.css"
	crossorigin="anonymous">
<link rel="stylesheet" href="css/pqrs.css" crossorigin="anonymous">

<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
	integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N"
	crossorigin="anonymous">
<script
	src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"
	integrity="sha384-Fy6S3B9q64WdZWQUiU+q4/2Lc9npb8tCaSX9FK7E8HnRr0Jz8D6OP9dO5Vg3Q9ct"
	crossorigin="anonymous"></script>
<script
	src='https://cdnjs.cloudflare.com/ajax/libs/bootstrap-validator/0.5.3/js/bootstrapValidator.min.js'></script>
<script
	src='https://cdnjs.cloudflare.com/ajax/libs/bootstrap-validator/0.5.3/js/language/es_ES.min.js'></script>
<link rel="icon" href="img/logo.ico" type="image/x-icon">
</head>
<body>
	<div id="cargarMenu"></div>
	<div class="container-pqrs">
		<h1 class="text-center">REGISTRO SOLICITUDES PQRS</h1>
		<form id="cliente">

			<div class="row">


				<div class="col-12 col-md-6">


					<div class="row">
						<div class="col-sm-6 form-group">
							<label>Fecha Solicitud</label><input type="text" id="fecha"
								placeholder="Selecciona una fecha" name="fecha"
								autocomplete="off" class="form-control">
						</div>
						<div class="col-sm-6 form-group">
							<label>Tipo de Solicitud</label><select id="selectSolicitud"
								class="form-control" required>
						  <option value="" disabled selected hidden>Seleccione una opción</option>
								<option value='peticion'>Petición</option>
								<option value='queja'>Queja</option>
								<option value='reclamo'>Reclamo</option>
								<option value='sugerencia'>Sugerencia</option>
								<option value='felicitacion'>Felicitación</option></select>
						</div>
						<div class="col-sm-6 form-group">
							<label>Teléfono Cliente</label><input type="text" id="telefono"
								name="telefono" class="form-control" maxlength="10"
								onchange="validarTelefono();">
						</div>
						<div class="col-sm-6 form-group">
							<label>Nombres</label><input type="text" id="nombres"
								name="nombres" class="form-control">
						</div>
						<div class="col-sm-6 form-group">
							<label>Apellidos</label><input type="text" id="apellidos"
								name="apellidos" class="form-control">
						</div>
						<div class="col-sm-6 form-group">
							<label>Dirección</label><input type="text" id="direccion"
								name="direccion" class="form-control">
						</div>
						<div class="col-sm-6 form-group">
							<label>Municipio</label><select id="selectMunicipio"
								class="form-control"></select>
						</div>
						<div class="col-sm-6 form-group">
							<label>Complemento Dirección</label><input type="text" id="zona"
								name="zona" class="form-control">
						</div>
						<div class="col-sm-12 form-group">
							<label>Adjuntar Archivos</label><input id="file-1" type="file"
								multiple class="file">
						</div>


					</div>
				</div>
				<div class="col-12 col-md-6">

					<div class="row">

						<div class="col-sm-6 form-group">
							<label>Tienda PQRS</label><select id="selectTiendas"
								class="form-control" required></select>
						</div>
						<div class="col-sm-6 form-group">
							<label>Origen PQRS</label><select id="selectOrigen"
								class="form-control" required></select>
						</div>
						<div class="col-sm-6 form-group">
							<label>Foco PQRS</label><select id="selectFoco"
								class="form-control" required></select>
						</div>
						<div class="col-sm-6 form-group">
							<label>Queja Externa/Interna</label><select id="selectTipo"
								class="form-control" required>
							   <option value="" disabled selected hidden>Seleccione una opción</option>
								<option value="externa">Externa</option>
								<option value="interna">Interna</option></select>
						</div>
						<div class="col-sm-6 form-group">
							<label>Área Responsable</label><select id="selectAreaResponsable"
								class="form-control" required>
									  <option value="" disabled selected hidden>Seleccione una opción</option>
								<option value="tienda">Tienda</option>
								<option value="contact">Contact</option>
								<option value="tecnologia">Tecnología</option>
								<option value="calidad">Calidad</option></select>
						</div>
						<div class="col-sm-6 form-group">
							<label>Registrado por</label><select id="selectUsuarioRegistro"
								class="form-control" required></select>
						</div>
						<div class="col-sm-6 form-group">
							<label>Redimido por</label><select id="selectUsuarioRedencion"
								class="form-control" required></select>
						</div>
						<div class="col-sm-6 form-group">
							<label>Estado</label><select id="selectEstado"
								class="form-control" required></select>
						</div>
						<div class="col-sm-6 form-group">
							<label>Factura Tienda</label><input type="text"
								id="idpedidotienda" name="idpedidotienda" class="form-control"
								onchange="validarNumero(this);">
						</div>
						<div class="col-sm-6 form-group">
							<label>Valor Pedido</label> <input type="text" id="valorPedido"
								name="valorPedido" class="form-control"
								onchange="validarNumero(this);">
						</div>

						<div class="col-sm-6 form-group">
							<label>Porcentaje Descuento</label> <select
								id="selectPorcentajeDesc" class="form-control"
								onchange="calcularDescuento();">
								<option value="0" selected>Ninguno</option>
								<option value="10">10%</option>
								<option value="20">20%</option>
								<option value="50">50%</option>
								<option value="100">100%</option>
							</select>
						</div>

						<div class="col-sm-6 form-group">
							<label>Valor del Descuento</label> <input type="text"
								id="valorDescuento" name="valorDescuento" class="form-control"
								onchange="validarNumero(this);">
						</div>



						<div class="col-sm-6 form-group">
							<label>Factura redención</label><input type="text"
								id="idpedidoredencion" name="idpedidoredencion"
								class="form-control" onchange="validarNumero(this);">
						</div>

						<div class="col-sm-6 form-group d-flex align-items-center">
							<label class="custom-switch mb-0"> <input type="checkbox"
								id="descuentoRedimido" name="descuentoRedimido"> <!-- Aquí está el cambio -->
								<span class="custom-slider"></span>
							</label> <label for="descuentoRedimido" class="mb-0 ml-2">
								Descuento redimido </label>
						</div>


						<div class="col-sm-12 form-group">
							<div class="card mt-4">
								<div class="card-header">
									<h5 class="mb-0">Comentarios</h5>
								</div>
								<div class="card-body">
									<!-- Historial de comentarios -->
									<div id="historialComentarios" class="mb-4">
										<!-- Comentarios cargados dinámicamente por JS -->
									</div>

									<!-- Nuevo comentario -->
									<div class="form-group">
										<textarea id="nuevoComentario" class="form-control" rows="3"></textarea>
										<button id="btnAgregarComentario" type="button"
											class="btn btn-primary mt-2">Añadir comentario</button>
									</div>
								</div>
							</div>
						</div>
						<div class="col-sm-12 text-lefth">
							<button type="button" class="btn btn-warning"
								onclick="limpiarSeleccionCliente()">Reiniciar Registro</button>
						</div>
					</div>
				</div>

				<!-- Tabla -->
				<div class="col-md-12">
					<div class="table-responsive-sm">
						<!-- solo responsive en pantallas pequeñas -->
						<table id="grid-clientes"
							class="table table-condensed table-hover table-striped"
							"
						style="font-size: 13px; table-layout: auto; word-wrap: break-word;">
							<thead class="thead-dark">
								<tr>
									<th>idCliente</th>
									<th>Tienda</th>
									<th>Nombres</th>
									<th>Apellidos</th>
									<th>Nom-Compañía</th>
									<th>Dirección</th>
									<th>Zona</th>
									<th>Observación</th>
									<th>Teléfono</th>
									<th>Memcode</th>
								</tr>
							</thead>
							<tbody></tbody>
						</table>

					</div>
					<div class="button-conf text-right">
						<button type="button" class="btn btn-success"
							onclick="ConfirmarPQRS()">Confirmar PQRS</button>
					</div>

				</div>
			</div>
		</form>
	</div>


	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
	<script src="js/pqrs.js" type="text/javascript"></script>
</html>
