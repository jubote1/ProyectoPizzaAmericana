<!DOCTYPE html>
<html lang="es">
	<head>
		<title>Asignar Rol a Usuario</title>
		<meta charset="utf-8" />
		  <link href="css/bootstrap.min.css" rel="stylesheet" type="text/css" />
		  <link rel="stylesheet" type="text/css" href="css/jquery.dataTables.min.css">
		  <script type="text/javascript" src="js/jquery-1.11.0.min.js"></script>
		  <script type="text/javascript" src="js/bootstrap.min.js"></script>
		  <script type="text/javascript" charset="utf8" src="js/jquery.dataTables.min.js"></script>
		  <script type="text/javascript" charset="utf8" src="js/bootbox.min.js"></script>
	</head>
	<body>

		<div id="cargarMenu"></div>
		<label id="usuariologin" style="color:black;"></label></p>
		<script type="text/javascript">
			var loc = window.location;
			var pathName = loc.pathname.substring(0, loc.pathname.lastIndexOf('/') + 1);
			server = loc.href.substring(0, loc.href.length - ((loc.pathname + loc.search + loc.hash).length - pathName.length));
			var respuesta ='';
			var usuario = "";
			$.ajax({
		    	url: server + 'ValidarUsuarioAplicacion',
		    	dataType: 'json', type: 'post', async: false,
		    	success: function(data){ respuesta = data[0].respuesta; usuario = data[0].nombreusuario; }
			});
			switch(respuesta)
		    		{
		    			case 'OK': $('#cargarMenu').load("Menu.html"); break;
		    			case 'OKA': $('#cargarMenu').load("MenuAdm.html"); break;
		    			default: location.href = server +"Index.html"; break;
		    		}
			    	$('#usuariologin').html(usuario);
		</script>

	<div class="container">
		<h3>Asignar Rol a Usuario</h3>
		<p style="color:#777">Que rol(es) tiene cada usuario activo. Un usuario puede tener mas de un rol.</p>
		<table id="grid-usuarios" class="table table-condensed table-hover table-striped table-bordered" cellspacing="0" width="100%">
			<thead>
				<tr>
					<th data-column-id="idusuario">Id</th>
					<th data-column-id="nombreusuario">Usuario</th>
					<th data-column-id="nombrelargo">Nombre</th>
					<th data-column-id="roles">Roles actuales</th>
					<th width="100">Editar</th>
				</tr>
			</thead>
		</table>
	</div>

	<form id="userForm" method="get" class="form-horizontal" style="display: none;">
	    <div class="form-group">
	        <label class="col-xs-3 control-label">Usuario</label>
	        <div class="col-xs-5"><input type="text" class="form-control" id="nombreUsuarioEdit" disabled="disabled" /></div>
	    </div>
	    <div id="checksRoles"></div>
	    <div class="form-group">
	        <div class="col-xs-5 col-xs-offset-3">
	            <button type="submit" onClick="confirmarGuardarRolesUsuario()" class="btn btn-default">Guardar</button>
	        </div>
	    </div>
	</form>
	</body>
	<script src="js/asignarRolUsuario.js" type="text/javascript"></script>
	</html>
