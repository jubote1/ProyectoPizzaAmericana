<!DOCTYPE html>
<html lang="es">
	<head>
		<title>Roles de Seguridad</title>
		<meta charset="utf-8" />
		  <link href="css/bootstrap.min.css" rel="stylesheet" type="text/css" />
		  <link rel="stylesheet" type="text/css" href="css/jquery.dataTables.min.css">
		  <script type="text/javascript" src="js/jquery-1.11.0.min.js"></script>
		  <script type="text/javascript" src="js/bootstrap.min.js"></script>
		  <script type="text/javascript" charset="utf8" src="js/jquery.dataTables.min.js"></script>
		  <script type="text/javascript" charset="utf8" src="js/bootbox.min.js"></script>
		  <script src='https://cdnjs.cloudflare.com/ajax/libs/bootstrap-validator/0.5.3/js/bootstrapValidator.min.js'></script>
    	  <script src='https://cdnjs.cloudflare.com/ajax/libs/bootstrap-validator/0.5.3/js/language/es_ES.min.js'></script>
		  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jquery-confirm/3.1.0/jquery-confirm.min.css">
	</head>
	<body>

		<div id="cargarMenu"></div>
		<script type="text/javascript">
			var loc = window.location;
			var pathName = loc.pathname.substring(0, loc.pathname.lastIndexOf('/') + 1);
			server = loc.href.substring(0, loc.href.length - ((loc.pathname + loc.search + loc.hash).length - pathName.length));
			var respuesta ='';
			var usuario = "";
			$.ajax({
		    	url: server + 'ValidarUsuarioAplicacion',
		    	dataType: 'json',
		    	type: 'post',
		    	async: false,
		    	success: function(data){
						    respuesta =  data[0].respuesta;
						    usuario = data[0].nombreusuario;
				}
			});
			switch(respuesta)
		    		{
		    			case 'OK':
		    				$('#cargarMenu').load("Menu.html", function () { $('#cargarMenu').find('#usuariologin').html(usuario); });
		    				break;
		    			case 'OKA':
		    				$('#cargarMenu').load("MenuAdm.html", function () { $('#cargarMenu').find('#usuariologin').html(usuario); });
		    				break;
		    			default:
		    				location.href = server +"Index.html";
		    				break;
		    		}
		</script>

	<div class="container">
		<p></p>
		<h3>Roles de Seguridad</h3>
		<p style="color:#777">Catalogo de roles del sistema. Para asignar pantallas a un rol o
		roles a un usuario, ve a <a href="AsignarPantallasRol.html">Asignar Pantallas a Rol</a>
		o <a href="AsignarRolUsuario.html">Asignar Rol a Usuario</a>.</p>
		<button class="btn btn-primary" data-toggle="modal" data-target="#addData">Crear Nuevo Rol</button>

			<div class="modal fade" id="addData" tabindex="-1" role="dialog" aria-labelledby="addLabel">
		  <div class="modal-dialog" role="document">
		    <div class="modal-content">
		      <div class="modal-header">
		        <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
		        <h4 class="modal-title" id="addLabel">Insertar Rol</h4>
		      </div>
		      <form>
		      <div class="modal-body">
		       		<div class="form-group">
					    <label>Nombre</label>
					    <input type="text" class="form-control" id="nombre" placeholder="Ej. Lider de Zona">
					  </div>
					  <div class="form-group">
					    <label>Descripcion</label>
					    <input type="text" class="form-control" id="descripcion" placeholder="Para que se usa este rol">
					  </div>
		      </div>
		      <div class="modal-footer">
		        <button type="button" class="btn btn-default" data-dismiss="modal">Cerrar</button>
		        <button type="submit" onClick="guardarRol()" class="btn btn-primary">Guardar Cambios</button>
		      </div>
		      </form>
		    </div>
		  </div>
		</div>

<form id="userForm" method="get" class="form-horizontal" style="display: none;">
    <div class="form-group">
        <label class="col-xs-3 control-label">Id</label>
        <div class="col-xs-3"><input type="text" class="form-control" name="idroledit" disabled="disabled" /></div>
    </div>
    <div class="form-group">
        <label class="col-xs-3 control-label">Nombre</label>
        <div class="col-xs-5"><input type="text" class="form-control" name="nombreedit" /></div>
    </div>
    <div class="form-group">
        <label class="col-xs-3 control-label">Descripcion</label>
        <div class="col-xs-5"><input type="text" class="form-control" name="descripcionedit" /></div>
    </div>
    <div class="form-group">
        <div class="col-xs-5 col-xs-offset-3">
            <button type="submit" onClick="confirmarEditarRol()" class="btn btn-default">Guardar</button>
        </div>
    </div>
</form>

		<table id="grid-roles" class="table table-condensed table-hover table-striped table-bordered" cellspacing="0" width="100%">
								        <thead>
								            <tr>
								                <th width="20" data-column-id="idrol">Id</th>
								                <th data-column-id="nombre">Nombre</th>
								                <th data-column-id="descripcion">Descripcion</th>
								                <th data-column-id="activo">Activo</th>
								                <th width="140">Editar/Eliminar</th>
								            </tr>
								        </thead>

								</table>
	</div>
	</body>
			<script src="js/rol.js" type="text/javascript"></script>
			<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-confirm/3.1.0/jquery-confirm.min.js"></script>
	</html>
