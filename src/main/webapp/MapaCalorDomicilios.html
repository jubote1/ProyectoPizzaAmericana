<!DOCTYPE html>
<html lang="es">
	<head>
		<title>Mapa de Calor de Domicilios</title>
		<meta charset="utf-8" />
		  <link href="css/bootstrap.min.css" rel="stylesheet" type="text/css" />
		  <link href="css/jquery-ui.min.css" rel="stylesheet" type="text/css" />
		  <script type="text/javascript" src="js/jquery-1.11.0.min.js"></script>
		  <script type="text/javascript" src="js/bootstrap.min.js"></script>
		  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jquery-confirm/3.1.0/jquery-confirm.min.css">
		  <!-- Mismo ArcGIS (version, tema y forma de cargar) que ya usa Pedidos.html: Google quito el mapa de
		       calor de su API (HeatmapLayer) desde la version 3.65, asi que no se puede seguir usando Google
		       Maps para esto. ArcGIS si tiene HeatmapRenderer vigente, y ya esta licenciado en este sistema. -->
		  <link rel="stylesheet" href="https://js.arcgis.com/4.27/esri/themes/light/main.css">
	</head>
	<body>

		<div id="cargarMenu"></div>
		<script type="text/javascript">

			var getImport;
			var getContent;
			//Obtenemos el valor de la variable server, con base en la URL digitada
			var loc = window.location;
			var pathName = loc.pathname.substring(0, loc.pathname.lastIndexOf('/') + 1);
			server = loc.href.substring(0, loc.href.length - ((loc.pathname + loc.search + loc.hash).length - pathName.length));
			var respuesta ='';
			var usuario = "";
			$.ajax({
		    	url: server + 'ValidarUsuarioAplicacion',
		    	dataType: 'json',
		    	type: 'post',
		    	async: false,
		    	success: function(data){
						    respuesta =  data[0].respuesta;
						    usuario = data[0].nombreusuario;

				}
			});
			switch(respuesta)
		    		{
		    			case 'OK':
		    				$('#cargarMenu').load("Menu.html", function () { $('#cargarMenu').find('#usuariologin').html(usuario); });
		    				break;
		    			case 'OKA':
		    				$('#cargarMenu').load("MenuAdm.html", function () { $('#cargarMenu').find('#usuariologin').html(usuario); });
		    				break;
		    			default:
		    				location.href = server +"Index.html";
		    				break;
		    		}

		</script>

		<style>
			.mc-panel { border: 1px solid #dee2e6; border-radius: 6px; background: #fff; margin: 14px; padding: 14px; }
			#mapaCalor { width: 100%; height: 560px; border-radius: 6px; margin-top: 10px; }
			.mc-resumen { font-size: 13px; color: #6c7482; margin-top: 8px; }
			.mc-resumen b { color: #102F6F; }
		</style>

		<div class="container-fluid">
			<h3 style="color:#102F6F;margin:14px;margin-bottom:0;">Mapa de Calor de Domicilios</h3>
			<p style="font-size:13px;color:#6c7482;margin:0 14px 0;">
				Con qu&eacute; tan seguido y en d&oacute;nde se piden domicilios en una tienda, en un rango de fechas.
				Solo entran pedidos de domicilio (no mostrador ni recoger en tienda) que no se hayan cancelado.
			</p>

			<div class="mc-panel">
				<div class="row">
					<div class="col-md-3">
						<label>Tienda</label>
						<select id="selectTiendas" class="form-control"></select>
					</div>
					<div class="col-md-3">
						<label>Fecha inicial</label>
						<input type="text" id="fechainicial" class="form-control" placeholder="dd/mm/aaaa">
					</div>
					<div class="col-md-3">
						<label>Fecha final</label>
						<input type="text" id="fechafinal" class="form-control" placeholder="dd/mm/aaaa">
					</div>
					<div class="col-md-3">
						<label>&nbsp;</label>
						<button type="button" class="btn btn-primary btn-block" onclick="mcConsultar()">Ver mapa de calor</button>
					</div>
				</div>
				<div id="mcAviso" style="margin-top:10px;"></div>
				<div id="mapaCalor"></div>
				<div class="mc-resumen" id="mcResumen"></div>
			</div>
		</div>

		<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-confirm/3.1.0/jquery-confirm.min.js"></script>
		<script src="js/jquery-ui.min.js"></script>
		<script type="text/javascript" src="js/datepicker.js"></script>
		<script src="https://js.arcgis.com/4.27/"></script>
		<script src="js/mapacalordomicilios.js" type="text/javascript"></script>
		<script>
			$("#fechainicial").datepicker($.datepicker.regional["es"]);
			$("#fechainicial").datepicker('setDate', new Date());
			$("#fechafinal").datepicker($.datepicker.regional["es"]);
			$("#fechafinal").datepicker('setDate', new Date());
		</script>
	</body>
</html>
