<!DOCTYPE html>
<html lang="es">
	<head>
		<title>Tiendas Bloqueadas</title>
		<meta charset="utf-8" />
		  <link href="css/bootstrap.min.css" rel="stylesheet" type="text/css" />
		  <link href="css/marca.css" rel="stylesheet" type="text/css" />
		  <link rel="stylesheet" type="text/css" href="css/jquery.dataTables.min.css">
		  <script type="text/javascript" src="js/jquery-1.11.0.min.js"></script> 
		  <script type="text/javascript" src="js/bootstrap.min.js"></script>
		  <script type="text/javascript" charset="utf8" src="js/jquery.dataTables.min.js"></script>
		  <script type="text/javascript" charset="utf8" src="js/bootbox.min.js"></script>
		  <script src='https://cdnjs.cloudflare.com/ajax/libs/bootstrap-validator/0.5.3/js/bootstrapValidator.min.js'></script>
    <script src='https://cdnjs.cloudflare.com/ajax/libs/bootstrap-validator/0.5.3/js/language/es_ES.min.js'></script>
		  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jquery-confirm/3.1.0/jquery-confirm.min.css">	
	</head>
	<body>

		<div id="cargarMenu"></div>
		<script type="text/javascript">
			
			var getImport; 
			var getContent;
			//Obtenemos el valor de la variable server, con base en la URL digitada
			var loc = window.location;
			var pathName = loc.pathname.substring(0, loc.pathname.lastIndexOf('/') + 1);
			server = loc.href.substring(0, loc.href.length - ((loc.pathname + loc.search + loc.hash).length - pathName.length));
			var respuesta ='';
			var usuario = "";
			$.ajax({ 
		    	url: server + 'ValidarUsuarioAplicacion', 
		    	dataType: 'json',
		    	type: 'post', 
		    	async: false, 
		    	success: function(data){
						    respuesta =  data[0].respuesta;	
						    usuario = data[0].nombreusuario;	
						    console.log(data);	
				} 
			});
			switch(respuesta)
		    		{
		    			case 'OK':
		    				$('#cargarMenu').load("Menu.html", function () { $('#cargarMenu').find('#usuariologin').html(usuario); });
		    				break;
		    			case 'OKA':
		    				$('#cargarMenu').load("MenuAdm.html", function () { $('#cargarMenu').find('#usuariologin').html(usuario); });
		    				break;	
		    			default:
		    				location.href = server +"Index.html";
		    				break;
		    		}
		    		
		</script>

	<div class="container">
		<h3>Tiendas Bloqueadas</h3>
		<p></p>
		<button class="btn btn-primary" data-toggle="modal" data-target="#addData">Crear Nueva Tienda Bloqueada</button>
			

			<!-- ESTO ES PARA LA ADICIÓN -->
				<div class="modal fade" id="addData" tabindex="-1" role="dialog" aria-labelledby="addLabel">
		  <div class="modal-dialog" role="document">
		    <div class="modal-content">
		      <div class="modal-header">
		        <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
		        <h4 class="modal-title" id="addLabel">Insertar Información</h4>
		      </div>
		      <form>
		      <div class="modal-body">
		       		<div class="form-group">
					    <label for="tienda">Tienda</label>
					    <select class="form-control" id="tienda" placeholder="Tienda"></select>
					  </div>
					  <div class="form-group" style="background: #f8f9fa; padding: 12px; border: 1px solid #e9ecef; border-radius: 4px;">
					    <label style="font-weight: bold; margin-bottom: 8px; display: block;">Canales a Bloquear:</label>
					    <div class="checkbox" style="margin-top: 0;">
					      <label style="font-weight: bold; color: #d9534f;">
					        <input type="checkbox" id="chkCanalTodos" checked onchange="toggleSeleccionarTodos(this)"> TODOS LOS CANALES (Bloqueo General)
					      </label>
					    </div>
					    <div style="margin-left: 20px; border-left: 2px solid #ddd; padding-left: 12px; margin-top: 6px;">
					      <div class="checkbox">
					        <label>
					          <input type="checkbox" class="chk-canal" value="BOT" checked onchange="actualizarEstadoTodos()"> Bot WhatsApp (CRM Kommo)
					        </label>
					      </div>
					      <div class="checkbox">
					        <label>
					          <input type="checkbox" class="chk-canal" value="TIENDA_VIRTUAL" checked onchange="actualizarEstadoTodos()"> Tienda Virtual / Página Web
					        </label>
					      </div>
					      <div class="checkbox">
					        <label>
					          <input type="checkbox" class="chk-canal" value="CALL_CENTER" checked onchange="actualizarEstadoTodos()"> Call Center (Pedidos Telefónicos)
					        </label>
					      </div>
					      <div class="checkbox">
					        <label>
					          <input type="checkbox" class="chk-canal" value="POS" checked onchange="actualizarEstadoTodos()"> Punto de Venta (Mostrador / Salón POS)
					        </label>
					      </div>
					    </div>
					  </div>
					  <div class="form-group">
					    <label for="observacion">Observacion</label>
					    <input type="text" class="form-control" id="observacion" placeholder="Observacion">
					  </div>
					  <div class="form-group">
					    <label for="motivo">Motivo</label>
					    <select id="selectMotivo" class="form-control">
					    	  <option value="Domiciliario Accidentado">Domiciliario Accidentado</option>
							  <option value="Domiciliario varado" selected>Domiciliario varado</option>
							  <option value="Falta de insumos (no ha llegado la comida)">Falta de insumos (no ha llegado la comida)</option>
							  <option value="Alta demanda de pedidos" selected>Alta demanda de pedidos</option>
							  <option value="Falta de energía">Falta de energía</option>
							  <option value="Daños de Internet">Daños de Internet</option>
							  <option value="Horno Dañado">Horno Dañado</option>
					    </select>
					  </div>
					  <div class="form-group">
					    <label for="desbloqueoen">Desbloqueo En:</label>
					    <select id="selectDesbloqueoEn" class="form-control">
					  		  <option value="15" selected>15 minutos</option>
							  <option value="20">20 minutos</option>
							  <option value="30">30 minutos</option>
							  <option value="NUNCA">NUNCA</option>
					    </select>
					  </div>
		      </div>
		      <div class="modal-footer">
		        <button type="button" class="btn btn-default" data-dismiss="modal">Cerrar</button>
		        <button type="button" onClick="guardarTiendaBloqueada()" class="btn btn-primary">Guardar Cambios</button>
		      </div>
		      </form>
		    </div>
		  </div>
		</div>


		<table id="grid-tiendasBloqueadas" class="table table-condensed table-hover table-striped table-bordered" cellspacing="0" width="100%">
								        <thead>
								            <tr>
								                <th width="20" data-column-id="idtienda">Id Tienda</th>
								                <th data-column-id="nombre">Nombre Tienda</th>
								                <th data-column-id="canal" width="160">Canal Afectado</th>
								                <th data-column-id="comentario">Comentario</th>
								                <th data-column-id="fecha">Fecha Auditoria</th>
								                <th width="120">Eliminar</th>
								            </tr>
								        </thead>
								      	
								</table>
	</div>
	</body>
			<script src="js/tiendabloqueada.js" type="text/javascript"></script>
			<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-confirm/3.1.0/jquery-confirm.min.js"></script>
	</html>
