<!DOCTYPE html>
<html lang="es">
	<head>
		<title>Asignar Pantallas a Rol</title>
		<meta charset="utf-8" />
		  <link href="css/bootstrap.min.css" rel="stylesheet" type="text/css" />
		  <script type="text/javascript" src="js/jquery-1.11.0.min.js"></script>
		  <script type="text/javascript" src="js/bootstrap.min.js"></script>
		  <script type="text/javascript" charset="utf8" src="js/bootbox.min.js"></script>
	</head>
	<body>

		<div id="cargarMenu"></div>
		<label id="usuariologin" style="color:black;"></label></p>
		<script type="text/javascript">
			var loc = window.location;
			var pathName = loc.pathname.substring(0, loc.pathname.lastIndexOf('/') + 1);
			server = loc.href.substring(0, loc.href.length - ((loc.pathname + loc.search + loc.hash).length - pathName.length));
			var respuesta ='';
			var usuario = "";
			$.ajax({
		    	url: server + 'ValidarUsuarioAplicacion',
		    	dataType: 'json', type: 'post', async: false,
		    	success: function(data){ respuesta = data[0].respuesta; usuario = data[0].nombreusuario; }
			});
			switch(respuesta)
		    		{
		    			case 'OK': $('#cargarMenu').load("Menu.html"); break;
		    			case 'OKA': $('#cargarMenu').load("MenuAdm.html"); break;
		    			default: location.href = server +"Index.html"; break;
		    		}
			    	$('#usuariologin').html(usuario);
		</script>

	<div class="container">
		<h3>Asignar Pantallas a Rol</h3>
		<p style="color:#777">Que pantallas del menu puede ver cada rol. Selecciona un rol,
		marca las pantallas y guarda -reemplaza por completo lo que el rol tenia asignado.</p>

		<div class="form-group">
			<label>Rol</label>
			<select id="idrol" class="form-control" style="max-width:400px" onchange="cargarPantallasDelRol()"></select>
		</div>

		<div id="modulos"></div>

		<button class="btn btn-primary" onclick="guardarAsignacion()">Guardar Asignacion</button>
	</div>
	</body>
	<script src="js/asignarPantallasRol.js" type="text/javascript"></script>
