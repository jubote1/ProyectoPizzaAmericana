<!DOCTYPE html>
<html lang="es">
	<head>
		<title>REPORTES DE MERCADEO</title>
		<meta charset="utf-8" />
		  <link href="css/bootstrap.min.css" rel="stylesheet" type="text/css" />
		  <link href="css/marca.css" rel="stylesheet" type="text/css" />
		  <script type="text/javascript" src="js/jquery-1.11.0.min.js"></script>
		  <script type="text/javascript" src="js/bootstrap.min.js"></script>
		  <style type="text/css">
			.rm-pie { font-size:12px; color:#6C7482; }
			.rm-marco { width:100%; border:0; display:block; }
			/* Con este Bootstrap los <li> sin .nav-item quedan sin estilo y las tres pestanas se
			   veian como un solo texto pegado ("Encuestas de MercadeoVenta IntegralIdentificacion...").
			   Mismo arreglo que EnvioPublicidad.html: separadas y con la activa marcada. */
			.nav-tabs { list-style:none; padding-left:0; margin-bottom:12px; border-bottom:1px solid #DEE2E6; }
			.nav-tabs > li { display:inline-block; margin-right:4px; margin-bottom:-1px; }
			.nav-tabs > li > a { display:block; padding:9px 18px; border:1px solid transparent;
				border-radius:5px 5px 0 0; text-decoration:none; font-weight:600; color:#102F6F; }
			.nav-tabs > li > a.active,
			.nav-tabs > li.active > a,
			.nav-tabs > li.active > a:hover,
			.nav-tabs > li.active > a:focus { background-color:#FFFFFF; color:#102F6F; font-weight:bold;
				border-color:#DEE2E6 #DEE2E6 #FFFFFF; border-top:3px solid #FDC806; }
		  </style>
	</head>
	<body>

		<div id="cargarMenu"></div>
		<script type="text/javascript">

			var loc = window.location;
			var pathName = loc.pathname.substring(0, loc.pathname.lastIndexOf('/') + 1);
			server = loc.href.substring(0, loc.href.length - ((loc.pathname + loc.search + loc.hash).length - pathName.length));
			var respuesta ='';
			var usuario = "";
			$.ajax({
		    	url: server + 'ValidarUsuarioAplicacion',
		    	dataType: 'json',
		    	type: 'post',
		    	async: false,
		    	success: function(data){
						    respuesta =  data[0].respuesta;
						    usuario = data[0].nombreusuario;
				}
			});
			switch(respuesta)
		    		{
		    			case 'OK':
		    				$('#cargarMenu').load("Menu.html", function () { $('#cargarMenu').find('#usuariologin').html(usuario); });
		    				break;
		    			case 'OKA':
		    				$('#cargarMenu').load("MenuAdm.html", function () { $('#cargarMenu').find('#usuariologin').html(usuario); });
		    				break;
		    			default:
		    				location.href = server +"Index.html";
		    				break;
		    		}
		</script>

		<div class="container-fluid">
			<h1>REPORTES DE MERCADEO</h1>

			<ul class="nav nav-tabs" role="tablist">
				<li role="presentation" class="active">
					<a href="#tab-encuestas" role="tab" data-toggle="tab" data-pagina="ConsultaEncuestaMercadeo.html?embebido=1">Encuestas de Mercadeo</a>
				</li>
				<li role="presentation">
					<a href="#tab-ventaintegral" role="tab" data-toggle="tab" data-pagina="VentaIntegralVivo.html?embebido=1">Venta Integral</a>
				</li>
				<li role="presentation">
					<a href="#tab-mostrador" role="tab" data-toggle="tab" data-pagina="IdentificacionMostrador.html?embebido=1">Identificacion en Mostrador</a>
				</li>
			</ul>

			<div class="tab-content">
				<div role="tabpanel" class="tab-pane active" id="tab-encuestas">
					<iframe class="rm-marco" data-vacio="1"></iframe>
				</div>
				<div role="tabpanel" class="tab-pane" id="tab-ventaintegral">
					<iframe class="rm-marco" data-vacio="1"></iframe>
				</div>
				<div role="tabpanel" class="tab-pane" id="tab-mostrador">
					<iframe class="rm-marco" data-vacio="1"></iframe>
				</div>
			</div>
		</div>

		<script type="text/javascript">
			/*
			 * Cada pestana es un iframe con la pantalla completa, no el HTML pegado
			 * aqui dentro.
			 *
			 * No es pereza: ventaIntegral.js y consultaencuestamercadeo.js definen los
			 * dos una funcion cargarTiendas() y una pintarResumen(). Metidos en la
			 * misma pagina, el segundo que cargue pisa al primero y una de las dos
			 * pestanas deja de funcionar, sin error visible. Separados por iframe cada
			 * uno conserva su mundo, las tres pantallas siguen sirviendo tambien por su
			 * cuenta, y arreglar una no puede romper a las otras.
			 *
			 * El parametro embebido=1 le dice a la pantalla de adentro que no cargue el
			 * menu, que ya lo tiene esta.
			 */
			function rmAlto()
			{
				//Lo que queda de ventana debajo de las pestanas, con un respiro abajo.
				var arriba = $('.nav-tabs').offset().top + $('.nav-tabs').outerHeight();
				var alto = $(window).height() - arriba - 20;
				return (alto < 500 ? 500 : alto);
			}

			function rmCargarPestana(enlace)
			{
				var panel = $($(enlace).attr('href'));
				var marco = panel.find('iframe');
				//Se carga la primera vez que se abre la pestana, no al entrar a la
				//pagina: si no, al abrir Reportes de Mercadeo arrancarian las tres
				//pantallas de una, y dos de ellas consultan las once tiendas.
				if (marco.attr('data-vacio') === '1') {
					marco.attr('src', $(enlace).data('pagina'));
					marco.removeAttr('data-vacio');
				}
				marco.height(rmAlto());
			}

			$(document).ready(function() {
				rmCargarPestana($('.nav-tabs li.active a'));
				$('a[data-toggle="tab"]').on('shown.bs.tab', function (e) {
					rmCargarPestana(e.target);
				});
				//El menu entra por ajax y puede llegar despues del ready: cuando eso
				//pasa las pestanas bajan y el iframe queda mas alto de la cuenta. Un
				//recalculo al terminar de cargar lo acomoda.
				$(window).on("load", function() {
					$(".rm-marco").each(function() {
						if (!$(this).attr("data-vacio")) { $(this).height(rmAlto()); }
					});
				});
				$(window).on('resize', function() {
					$('.rm-marco').each(function() {
						if (!$(this).attr('data-vacio')) { $(this).height(rmAlto()); }
					});
				});
			});
		</script>
	</body>
</html>
