<!DOCTYPE html>
<html lang="es">
	<head>
		<title>TABLERO DE SEGMENTOS</title>
		<meta charset="utf-8" />
		<link href="css/bootstrap.min.css" rel="stylesheet" type="text/css" />
		<script type="text/javascript" src="js/jquery-1.11.0.min.js"></script>
		<script type="text/javascript" src="js/bootstrap.min.js"></script>
		<style type="text/css">
			body { background-color:#F4F6F8; }
			.tb-panel { border:1px solid #E2E6EC; border-radius:6px; padding:14px 16px;
				background-color:#FFFFFF; margin-bottom:14px; }
			.tb-titulo { font-size:13px; font-weight:bold; color:#102F6F; text-transform:uppercase;
				letter-spacing:.04em; border-bottom:2px solid #FDC806; padding-bottom:5px;
				margin-bottom:12px; }
			.tb-nota { font-size:11.5px; color:#6C7482; }

			/* Los cuatro numeros de arriba */
			.tb-kpi { text-align:center; padding:12px 6px; border:1px solid #E5E8ED;
				border-radius:5px; background-color:#FAFBFC; margin-bottom:12px; }
			.tb-kpi .valor { font-size:25px; font-weight:bold; color:#102F6F; line-height:1.1; }
			.tb-kpi .rotulo { font-size:10.5px; color:#6C7482; text-transform:uppercase; margin-top:4px; }

			/* La cinta: toda la base en una sola barra, a escala */
			.tb-cinta { height:46px; width:100%; border-radius:4px; overflow:hidden;
				background-color:#EDF0F4; white-space:nowrap; font-size:0; }
			.tb-tramo { height:100%; display:inline-block; vertical-align:top; cursor:pointer;
				position:relative; }
			.tb-tramo:hover { opacity:.82; }
			.tb-leyenda { margin-top:10px; font-size:0; }
			.tb-llave { display:inline-block; font-size:11.5px; color:#41495A; margin:0 14px 5px 0;
				white-space:nowrap; }
			.tb-punto { display:inline-block; width:10px; height:10px; border-radius:2px;
				margin-right:5px; vertical-align:-1px; }

			/* Una tarjeta por segmento */
			.tb-tarjeta { border:1px solid #E2E6EC; border-left-width:6px; border-radius:5px;
				background-color:#FFFFFF; padding:12px 14px; margin-bottom:12px; height:100%; }
			.tb-nombre { font-size:15px; font-weight:bold; letter-spacing:.02em; }
			.tb-desc { font-size:12px; color:#41495A; margin-top:3px; min-height:32px; }
			.tb-reglas { font-size:11.5px; color:#6C7482; background-color:#F7F9FC;
				border-radius:3px; padding:6px 8px; margin-top:8px; min-height:30px; }
			.tb-y { font-weight:bold; color:#A0A7B4; }
			.tb-cifra { font-size:27px; font-weight:bold; color:#102F6F; line-height:1.05;
				margin-top:9px; }
			.tb-pct { font-size:11.5px; color:#6C7482; }
			.tb-sub { font-size:11.5px; color:#41495A; margin-top:7px; border-top:1px solid #EDF0F4;
				padding-top:7px; }
			.tb-barrita { height:6px; border-radius:3px; background-color:#EDF0F4; margin-top:5px;
				overflow:hidden; }
			.tb-barrita div { height:100%; }
			.tb-apagado { opacity:.55; }
			.tb-aviso { background-color:#FCF2DD; border:1px solid #F0DCA8; color:#6B4E00;
				border-radius:5px; padding:9px 12px; font-size:12.5px; margin-bottom:12px; }
			.tb-malo { background-color:#FADBDB; border:1px solid #EFB6B6; color:#8A1C1F;
				border-radius:5px; padding:9px 12px; font-size:12.5px; margin-bottom:12px; }
			.tb-ver { font-size:11.5px; }
		</style>
	</head>
	<body>

		<div id="cargarMenu"></div>
		<script type="text/javascript">

			var loc = window.location;
			var pathName = loc.pathname.substring(0, loc.pathname.lastIndexOf('/') + 1);
			server = loc.href.substring(0, loc.href.length - ((loc.pathname + loc.search + loc.hash).length - pathName.length));
			var respuesta = '';
			var usuario = "";
			$.ajax({
				url: server + 'ValidarUsuarioAplicacion',
				dataType: 'json',
				type: 'post',
				async: false,
				success: function (data) {
					respuesta = data[0].respuesta;
					usuario = data[0].nombreusuario;
				}
			});
			if (respuesta !== 'OK' && respuesta !== 'OKA' && respuesta !== 'OKP') {
				location.href = server + "Index.html";
			} else {
				//Este tablero resume datos personales de 450 mil personas. La
				//proteccion real esta en el servicio, que valida por su cuenta;
				//esto es para no dejar a nadie viendo una pantalla que nunca carga.
				$.ajax({
					url: server + 'ValidarAccesoCRM',
					dataType: 'json',
					async: false,
					success: function (d) {
						if (d && d.acceso) {
							$('#cargarMenu').load("MenuCRM.html", function () {
								$('#cargarMenu').find('#usuariologin').html(usuario);
							});
						} else {
							document.write('<style>.container-fluid{display:none !important;}</style>' +
								'<div style="font-family:sans-serif;max-width:620px;' +
								'margin:80px auto;padding:26px 30px;border:1px solid #E2E6EC;' +
								'border-radius:6px;background:#FFF;">' +
								'<h4 style="color:#102F6F;margin-top:0;">Sin acceso al CRM</h4>' +
								'<p style="color:#41495A;font-size:14px;">Su usuario no tiene ' +
								'habilitado el area de CRM. Solicitelo a tecnologia.</p>' +
								'<a href="Menu.html" style="font-size:13px;">Volver al menu</a></div>');
						}
					},
					error: function () {
						location.href = server + "Index.html";
					}
				});
			}
		</script>

		<div class="container-fluid" style="padding:16px 20px;">

			<div class="row">
				<div class="col-md-12">
					<h4 style="color:#102F6F;font-weight:bold;margin:0 0 3px 0;">Tablero de segmentos</h4>
					<div class="tb-nota" id="tb-corte">Cargando&hellip;</div>
					<hr style="margin:10px 0 14px 0;" />
				</div>
			</div>

			<div id="tb-mensaje"></div>

			<!-- ============ LOS CUATRO NUMEROS ============ -->
			<div class="row">
				<div class="col-md-3 col-xs-6"><div class="tb-kpi">
					<div class="valor" id="tb-k-personas">&mdash;</div>
					<div class="rotulo">Personas en la base</div></div></div>
				<div class="col-md-3 col-xs-6"><div class="tb-kpi">
					<div class="valor" id="tb-k-contactables">&mdash;</div>
					<div class="rotulo">Se les puede escribir</div></div></div>
				<div class="col-md-3 col-xs-6"><div class="tb-kpi">
					<div class="valor" id="tb-k-valor">&mdash;</div>
					<div class="rotulo">Compras registradas</div></div></div>
				<div class="col-md-3 col-xs-6"><div class="tb-kpi">
					<div class="valor" id="tb-k-segmentos">&mdash;</div>
					<div class="rotulo">Segmentos activos</div></div></div>
			</div>

			<!-- ============ LA CINTA ============ -->
			<div class="row">
				<div class="col-md-12">
					<div class="tb-panel">
						<div class="tb-titulo">C&oacute;mo est&aacute; repartida la base</div>
						<div class="tb-cinta" id="tb-cinta"></div>
						<div class="tb-leyenda" id="tb-leyenda"></div>
						<div class="tb-nota" style="margin-top:8px;">
							Cada tramo es proporcional a la cantidad de personas. Oprima uno
							para ver la lista de ese segmento.
						</div>
					</div>
				</div>
			</div>

			<!-- ============ LAS TARJETAS ============ -->
			<div class="row" id="tb-tarjetas"></div>

			<div class="row">
				<div class="col-md-12">
					<div class="tb-nota" id="tb-pie" style="margin-bottom:20px;"></div>
				</div>
			</div>
		</div>

		<script type="text/javascript" src="js/tablerosegmentos.js"></script>
	</body>
</html>
