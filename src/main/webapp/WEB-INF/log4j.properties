# ============================================================================
# Configuracion de log4j del proyecto central.
#
# Queda escrito por que esta asi, para que no se devuelva sin darse cuenta.
#
# Hasta el 2026-09-07 el root escribia a un ConsoleAppender sin filtro. En
# Tomcat System.out ES catalina.out, y como el proyecto tiene 393 llamadas a
# logger.info() con la sentencia SQL completa, cada consulta de cada pedido
# terminaba escrita ahi. Ese archivo llego a 8,6 GB sin rotar nunca, y de
# paso sepultaba los volcados de hilos cuando hubo que diagnosticar la caida
# del servidor: el diagnostico se volvio mas dificil por el propio log.
#
# Y el appender de archivo apuntaba a C:\log\prueba.log, una ruta de Windows
# en un servidor Ubuntu, asi que nunca pudo escribir nada. El log de
# aplicacion que se penso aqui simplemente no existia.
#
# Lo que cambio:
#   - El log de la aplicacion existe de verdad y rota por tamano con un techo
#     real: 50 MB por archivo y 10 de respaldo, 550 MB como maximo absoluto.
#   - catalina.out solo recibe ERROR y FATAL. Los errores siguen saliendo
#     donde uno los busca, pero el SQL de cada pedido ya no.
#
# El nivel del root se queda en DEBUG a proposito. No se pierde nada de lo
# que se venia registrando -hay 79 logger.debug() en uso-, solo cambia a
# donde va y deja de crecer sin control.
# ============================================================================

log4j.rootCategory=DEBUG,A4,stdout

# ----------------------------------------------------------------------------
# stdout: termina en catalina.out. Solo errores.
#
# El Threshold es la linea que corta el chorro. Sin el, los 393 logger.info()
# con SQL vuelven a caer en catalina.out.
# ----------------------------------------------------------------------------
log4j.appender.stdout=org.apache.log4j.ConsoleAppender
log4j.appender.stdout.Threshold=ERROR
log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
log4j.appender.stdout.layout.ConversionPattern=[%d] [%C{1}.%M(%L)] - %-5p - %m%n

# ----------------------------------------------------------------------------
# A4: el log de la aplicacion, con todo el detalle y con techo.
#
# La ruta usa ${catalina.base} y no una ruta fija a proposito: asi el mismo
# archivo sirve en el servidor y en el Eclipse local, sin que nadie tenga que
# editarlo antes de desplegar. Eso fue lo que dejo la ruta de Windows metida
# en produccion.
#
# Y es RollingFileAppender, no DailyRollingFileAppender: el segundo IGNORA
# MaxFileSize y MaxBackupIndex -estaban puestos y no hacian nada- y acumula un
# archivo por dia para siempre.
# ----------------------------------------------------------------------------
log4j.appender.A4=org.apache.log4j.RollingFileAppender
log4j.appender.A4.file=${catalina.base}/logs/aplicacion.log
log4j.appender.A4.MaxFileSize=50MB
log4j.appender.A4.MaxBackupIndex=10
log4j.appender.A4.append=true
log4j.appender.A4.layout=org.apache.log4j.PatternLayout
log4j.appender.A4.layout.ConversionPattern=[%d] [%c.%M(%L)] - %-5p - %m%n
